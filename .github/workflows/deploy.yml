name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 仅受 GHA job 超时约束（不再依赖 appleboy 默认 10m）
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode SSH private key
        id: ssh
        env:
          SSH_KEY_SECRET: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          if printf '%s' "$SSH_KEY_SECRET" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY_SECRET" > "$KEY_FILE"
          else
            printf '%s' "$SSH_KEY_SECRET" | tr -d '\r\n\t ' | base64 -d > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          echo "key_path=$KEY_FILE" >> "$GITHUB_OUTPUT"
          echo "SSH key decoded OK"

      - name: Pack release tarball
        run: |
          set -euo pipefail
          tar -czf pchat_mcp_rag.tgz \
            --exclude='./.git' \
            --exclude='./pchat_mcp_rag.tgz' \
            --exclude='*/.venv' \
            --exclude='*/venv' \
            --exclude='*/node_modules' \
            --exclude='*/data' \
            --exclude='*/logs' \
            --exclude='*/__pycache__' \
            --exclude='*/.pytest_cache' \
            --exclude='*/.mypy_cache' \
            --exclude='*/ui/dist' \
            .
          ls -lh pchat_mcp_rag.tgz

      - name: Upload + remote build (native SSH, no 10m appleboy limit)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          KEY_PATH: ${{ steps.ssh.outputs.key_path }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          DIR="${DEPLOY_DIR:-/opt/pchat_mcp_rag}"
          SSH=(ssh -i "$KEY_PATH" -p "$PORT" -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=120)
          SCP=(scp -i "$KEY_PATH" -P "$PORT" -o StrictHostKeyChecking=no)

          echo "Uploading tarball..."
          "${SCP[@]}" pchat_mcp_rag.tgz "${SSH_USER}@${SSH_HOST}:/tmp/pchat_mcp_rag.tgz"

          echo "Remote unpack + compose..."
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "DEPLOY_DIR=$(printf %q "$DIR") bash -s" <<'EOS'
          set -euo pipefail
          mkdir -p "$DEPLOY_DIR"
          if [ -f "$DEPLOY_DIR/.env" ]; then
            cp "$DEPLOY_DIR/.env" /tmp/pchat.env.bak
          fi
          tar -xzf /tmp/pchat_mcp_rag.tgz -C "$DEPLOY_DIR"
          rm -f /tmp/pchat_mcp_rag.tgz
          if [ -f /tmp/pchat.env.bak ]; then
            cp /tmp/pchat.env.bak "$DEPLOY_DIR/.env"
          fi
          cd "$DEPLOY_DIR"
          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_DIR/.env — create it once from .env.example"
            exit 1
          fi

          LOG=/tmp/pchat-compose.log
          rm -f "$LOG"
          # 后台构建，SSH 会话只负责轮询（ServerAlive 保活）
          setsid docker compose up -d --build >"$LOG" 2>&1 < /dev/null &
          echo $! > /tmp/pchat-compose.pid
          echo "Started docker compose pid=$(cat /tmp/pchat-compose.pid)"

          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/docs >/dev/null 2>&1 \
               && curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
              echo "Both agent and dashboard are healthy"
              ok=1
              break
            fi
            if ! kill -0 "$(cat /tmp/pchat-compose.pid)" 2>/dev/null; then
              echo "compose process exited; checking services..."
              if curl -fsS http://127.0.0.1:8080/docs >/dev/null 2>&1; then
                ok=1
              fi
              break
            fi
            echo "[$i/90] building... (tail)"
            tail -n 8 "$LOG" || true
            sleep 60
          done

          echo "======== last 100 log lines ========"
          tail -n 100 "$LOG" || true
          docker compose ps || true

          if [ "$ok" -ne 1 ]; then
            echo "Deploy failed or timed out waiting for healthy services"
            exit 1
          fi
          echo "Deploy OK"
          EOS
