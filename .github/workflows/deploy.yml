name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Decode SSH private key
        id: ssh
        env:
          SSH_KEY_SECRET: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/deploy_key"
          if printf '%s' "$SSH_KEY_SECRET" | grep -q "BEGIN .*PRIVATE KEY"; then
            printf '%s\n' "$SSH_KEY_SECRET" > "$KEY_FILE"
          else
            printf '%s' "$SSH_KEY_SECRET" | tr -d '\r\n\t ' | base64 -d > "$KEY_FILE"
          fi
          chmod 600 "$KEY_FILE"
          ssh-keygen -y -f "$KEY_FILE" >/dev/null
          DELIM="KEY_$(openssl rand -hex 16)"
          {
            echo "key<<${DELIM}"
            cat "$KEY_FILE"
            echo ""
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"
          echo "SSH key decoded OK"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ steps.ssh.outputs.key }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # 必须显式加长；默认 10m。后台构建 + 轮询也需覆盖等待窗口
          command_timeout: 2h
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR='${{ secrets.DEPLOY_DIR }}'
            if [ -z "$DEPLOY_DIR" ]; then
              DEPLOY_DIR=/opt/pchat_mcp_rag
            fi

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              echo "Deploy directory missing or not a git repo: $DEPLOY_DIR"
              echo "On the server run once:"
              echo "  sudo mkdir -p $DEPLOY_DIR && sudo chown \$USER:\$USER $DEPLOY_DIR"
              echo "  git clone https://github.com/Kayn7755/PChat_MCP_RAG.git $DEPLOY_DIR"
              echo "  cd $DEPLOY_DIR && cp .env.example .env && nano .env"
              exit 1
            fi

            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing $DEPLOY_DIR/.env — copy from .env.example and fill secrets"
              exit 1
            fi

            LOG=/tmp/pchat-compose.log
            rm -f "$LOG"
            # 后台构建，避免 SSH/action 中间链路提前断开；本脚本再轮询结果
            setsid docker compose up -d --build >"$LOG" 2>&1 < /dev/null &
            echo $! > /tmp/pchat-compose.pid
            echo "Started docker compose build pid=$(cat /tmp/pchat-compose.pid)"

            ok=0
            for i in $(seq 1 100); do
              if curl -fsS http://127.0.0.1:8080/docs >/dev/null 2>&1 \
                 && curl -fsS http://127.0.0.1:8501/_stcore/health >/dev/null 2>&1; then
                echo "Both agent and dashboard are healthy"
                ok=1
                break
              fi
              if ! kill -0 "$(cat /tmp/pchat-compose.pid)" 2>/dev/null; then
                echo "compose process exited; checking services..."
                if curl -fsS http://127.0.0.1:8080/docs >/dev/null 2>&1; then
                  ok=1
                fi
                break
              fi
              echo "[$i/100] building... (tail)"
              tail -n 5 "$LOG" || true
              sleep 60
            done

            echo "======== last 80 log lines ========"
            tail -n 80 "$LOG" || true
            docker compose ps || true

            if [ "$ok" -ne 1 ]; then
              echo "Deploy failed or timed out waiting for healthy services"
              exit 1
            fi
            echo "Deploy OK"
