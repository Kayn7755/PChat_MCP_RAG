<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI 现代主页</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <nav class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <span class="text-xl font-bold text-blue-600">FastAPI Demo</span>
            <div class="space-x-6 text-sm font-medium">
                <a href="#" class="hover:text-blue-500 transition">文档</a>
                <a href="#" class="hover:text-blue-500 transition">GitHub</a>
                <a href="/fastapi_study/filey/file" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">查看图片</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 py-16">
        <div class="text-center">
            <h1 class="text-5xl font-extrabold tracking-tight text-slate-900 mb-6">
                你好，欢迎来到<span class="text-blue-600">FastAPI</span> 世界
            </h1>
            <p class="text-lg text-slate-600 max-w-2xl mx-auto mb-10">
                这是一个美观的、响应式的页面，由 HTMLResponse 直接驱动。你可以通过这个界面与你的后端接口进行交互。
            </p>

            <div class="grid md:grid-cols-3 gap-8 text-left mt-12">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center mb-4">
                        🚀
                    </div>
                    <h3 class="font-semibold text-lg mb-2">极速开发</h3>
                    <p class="text-sm text-slate-500">基于 Python 类型提示，让你在编写代码时享受丝滑的自动补全。</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center mb-4">
                        🛡️
                    </div>
                    <h3 class="font-semibold text-lg mb-2">安全可靠</h3>
                    <p class="text-sm text-slate-500">Pydantic 自动进行数据校验和过滤，从源头杜绝安全漏洞。</p>
                </div>

                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition">
                    <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center mb-4">
                        📚
                    </div>
                    <h3 class="font-semibold text-lg mb-2">自动文档</h3>
                    <p class="text-sm text-slate-500">无需手动编写接口文档，Swagger UI 随代码自动生成，即刻可用。</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="mt-20 border-t border-slate-200 py-8 text-center text-slate-400 text-sm">
        <p>&copy; 2026 FastAPI 学习笔记. Built with Love.</p>
    </footer>

</body>
</html>
